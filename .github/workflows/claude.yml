name: Claude

# Modo etiqueta: Ulises escribe `@claude …` en un issue, un PR o una revisión y Claude
# responde, implementa o corrige en una rama. Corre con la suscripción (token OAuth de
# `claude setup-token`), no con API key. Opera en GitHub con la credencial de automatización
# (PAT): lo que empuja la app de Claude queda atribuido a un bot sin permisos y el CI del PR
# pide aprobación manual; con el PAT los pushes disparan el CI y los PRs se fusionan.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Mismo motivo que en ci-auto-fix.yml: el push de Claude usa esta credencial.
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AUTOMATION_TOKEN }}
          # Autoría de los commits como el dueño (ver ci-auto-fix.yml).
          bot_id: "7233165"
          bot_name: "gonzalezulises"
          claude_args: "--max-turns 40"
